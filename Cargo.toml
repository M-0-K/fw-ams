[workspace]
resolver = "2"
members = ["crates/fw-ams-core", "crates/fw-ams-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/fw-ams/fw-ams"

[workspace.dependencies]
fw-ams-core = { path = "crates/fw-ams-core" }
framework_lib = "0.6.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
nusb = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
