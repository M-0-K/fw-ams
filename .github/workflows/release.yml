name: release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to build and publish a release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
          # Oldest supported Ubuntu: the packages then also run on older distributions
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != Cargo.toml version $version"; exit 1; }

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libudev-dev libusb-1.0-0-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Tests
        run: cargo test --workspace

      - name: Frontend
        working-directory: app
        run: npm ci

      # Builds the helper service and fetches the signed RyzenSMU module (pinned, SHA-256 checked)
      - name: Bundle (Windows, with helper service)
        if: runner.os == 'Windows'
        working-directory: app
        run: npm run bundle:windows

      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        working-directory: app
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          find dist -type f -exec mv {} dist/ \; 2>/dev/null || true
          find dist -mindepth 1 -type d -empty -delete
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          version="${GITHUB_REF_NAME#v}"
          # Section of this version from CHANGELOG.md
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (index($0, "## [") == 1 || substr($0, 1, 1) == "[") { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $version"; exit 1; }
          cat >> notes.md <<'EOF'

          ## Installation

          - **Windows 10/11:** `fw-ams_*_x64-setup.exe` ausführen. Voraussetzung: Framework Driver Bundle und aktuelles BIOS. Der Installer ist nicht code-signiert – SmartScreen: *Weitere Informationen → Trotzdem ausführen*.
          - **Debian/Ubuntu:** `sudo apt install ./fw-ams_*_amd64.deb`
          - **Fedora/openSUSE:** `sudo dnf install ./fw-ams-*.x86_64.rpm`
          - **Andere Distributionen:** `.AppImage` ausführbar machen und starten; udev-Regel siehe README.

          Prüfsummen: `SHA256SUMS.txt`. Anleitung und Hinweise: [README](https://github.com/M-0-K/fw-ams#readme).
          EOF
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: fw-ams ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
